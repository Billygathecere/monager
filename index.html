<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>Monager — Personal Money Manager</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg">

  <!-- Tailwind CSS & Google Fonts & Material Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              900: '#064e3b',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    :root {
      --color-brand-primary: #10b981;
      --color-brand-hover: #34d399;
      --app-density-scale: 1.0;
    }

    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Light Mode Overrides */
    html.light body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    html.light .glass-card {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(15, 23, 42, 0.08) !important;
      color: #0f172a;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }
    html.light .glass-header {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(15, 23, 42, 0.08) !important;
    }
    html.light .btn-secondary {
      background: rgba(15, 23, 42, 0.04);
      border-color: rgba(15, 23, 42, 0.12);
      color: #1e293b;
    }
    html.light .btn-secondary:hover {
      background: rgba(15, 23, 42, 0.08);
      border-color: rgba(15, 23, 42, 0.2);
    }
    html.light input, html.light select, html.light textarea {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }

    /* Standard Cards & Header */
    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .glass-header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .btn-primary {
      background: var(--color-brand-primary, #10b981);
      color: #022c22;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: var(--color-brand-hover, #34d399);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-accent {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      transition: all 0.2s ease;
    }
    .btn-accent:hover {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
    }

    /* Accessibility & Density */
    html.reduced-motion *, html[data-reduced-motion="true"] * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }

    html.high-contrast .glass-card {
      border-width: 2px !important;
      border-color: rgba(255, 255, 255, 0.35) !important;
    }

    .density-compact {
      font-size: 0.95em;
    }
    .density-spacious {
      font-size: 1.05em;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="selection:bg-emerald-500 selection:text-black">

  <!-- Global Top Header Navigation (Desktop & Tablet) -->
  <header class="glass-header sticky top-0 z-40 border-b border-white/10 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">

      <!-- Brand & Version -->
      <div id="header-brand-btn" class="flex items-center gap-3 cursor-pointer select-none">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-blue-600 flex items-center justify-center font-mono font-black text-black text-base shadow-lg shadow-emerald-500/20">
          M
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-mono font-black tracking-wider text-base text-white">MONAGER</span>
            <span class="px-1.5 py-0.5 text-[10px] font-mono font-bold rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">V3.2</span>
          </div>
          <p class="text-[10px] text-slate-400 font-mono tracking-tight">Money Command Center</p>
        </div>
      </div>

      <!-- Desktop Nav Items (Visible only when authenticated) -->
      <nav class="hidden items-center gap-1.5" id="desktop-nav-menu">
        <button class="desktop-nav-item" data-page="dashboard">
          <span class="material-icons-outlined text-sm">dashboard</span> Dashboard
        </button>
        <button class="desktop-nav-item" data-page="money">
          <span class="material-icons-outlined text-sm">account_balance_wallet</span> Money
        </button>
        <button class="desktop-nav-item" data-page="goals">
          <span class="material-icons-outlined text-sm">flag</span> Goals
        </button>
        <button class="desktop-nav-item" data-page="affordability">
          <span class="material-icons-outlined text-sm">calculate</span> Affordability
        </button>
        <button class="desktop-nav-item" data-page="analytics">
          <span class="material-icons-outlined text-sm">insights</span> Analytics
        </button>
        <button class="desktop-nav-item" data-page="currency">
          <span class="material-icons-outlined text-sm">currency_exchange</span> Currency
        </button>
        <button class="desktop-nav-item" data-page="ai">
          <span class="material-icons-outlined text-sm">smart_toy</span> Monager AI
        </button>
        <button class="desktop-nav-item" data-page="settings">
          <span class="material-icons-outlined text-sm">settings</span> Settings
        </button>
      </nav>

      <!-- Authenticated Profile Action -->
      <div id="header-authenticated-actions" class="hidden items-center gap-3">
        <button id="header-profile-btn" class="flex items-center gap-2 p-1.5 rounded-xl bg-white/5 border border-white/10 hover:border-white/20 transition cursor-pointer">
          <div id="header-user-initial" class="w-6 h-6 rounded-lg bg-slate-800 flex items-center justify-center text-xs font-mono font-bold text-emerald-400">
            F
          </div>
          <span id="header-user-name" class="text-xs font-mono text-slate-300 hidden sm:inline">Free user</span>
        </button>
      </div>

      <!-- Public Logged-Out Actions -->
      <div id="header-public-actions" class="flex items-center gap-2.5">
        <button id="header-signin-btn" class="btn-secondary px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer">
          <span class="material-icons-outlined text-sm text-slate-400">login</span>
          <span>Sign In</span>
        </button>
        <button id="header-get-started-btn" class="btn-primary px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center gap-1 cursor-pointer">
          <span>Get Started</span>
          <span class="material-icons-outlined text-sm">arrow_forward</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main View Container Mounted by JS Router -->
  <main id="app-view-container" class="max-w-7xl mx-auto px-4 lg:px-8 py-6 md:py-8 min-h-[calc(100vh-140px)] pb-24 md:pb-12">
    <!-- Rendered dynamically by src/main.js -->
    <div class="flex items-center justify-center py-20 text-slate-500 font-mono text-sm">
      <span class="material-icons-outlined animate-spin mr-2">refresh</span>
      Loading Monager Command Center...
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar (Visible only on mobile when authenticated) -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 glass-header border-t border-white/10 px-2 py-1 flex items-center justify-around z-40">
    <button class="mobile-nav-item" data-page="dashboard">
      <span class="material-icons-outlined text-xl">dashboard</span>
      <span class="text-[10px] font-mono mt-0.5">Home</span>
    </button>
    <button class="mobile-nav-item" data-page="money">
      <span class="material-icons-outlined text-xl">account_balance_wallet</span>
      <span class="text-[10px] font-mono mt-0.5">Money</span>
    </button>
    <button class="mobile-nav-item" data-page="goals">
      <span class="material-icons-outlined text-xl">flag</span>
      <span class="text-[10px] font-mono mt-0.5">Goals</span>
    </button>
    <button class="mobile-nav-item" data-page="affordability">
      <span class="material-icons-outlined text-xl">calculate</span>
      <span class="text-[10px] font-mono mt-0.5">Afford</span>
    </button>
    <button class="mobile-nav-item" data-page="ai">
      <span class="material-icons-outlined text-xl">smart_toy</span>
      <span class="text-[10px] font-mono mt-0.5">AI</span>
    </button>
    <button class="mobile-nav-item" data-page="settings">
      <span class="material-icons-outlined text-xl">settings</span>
      <span class="text-[10px] font-mono mt-0.5">More</span>
    </button>
  </nav>

  <!-- Salary Reminder Modal Container -->
  <div id="salary-reminder-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"></div>

  <!-- Main JavaScript Application Module -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
